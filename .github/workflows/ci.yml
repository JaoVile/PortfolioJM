name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Lint (nao bloqueia — 55 erros conhecidos, ver #tech-debt)
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
